name: Validate and publish portable skill
on:
  push:
    branches: [main]
    paths: ['.github/skill-release.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wow335-skill-release
  cancel-in-progress: false
jobs:
  skill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Check skill tools and template
        run: |
          python3 .agents/skills/addons-wow-3-3-5a/scripts/test_tools.py
          python3 .agents/skills/addons-wow-3-3-5a/scripts/audit_addon.py \
            .agents/skills/addons-wow-3-3-5a/templates/Addon335Template --luac luac5.1
          python3 tools/check_phase0.py
          git diff --check
      - name: Build portable bundles
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          meta = json.loads(Path('.github/skill-release.json').read_text())
          version = Path('.agents/skills/addons-wow-3-3-5a/VERSION').read_text().strip()
          assert meta == {'tag': 'skill-addons-wow-3-3-5a-v' + version, 'version': version}
          assert version == '1.0.0'
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('SKILL_TAG=' + meta['tag'] + '\n')
          PY
          mkdir -p dist-skill
          python3 .agents/skills/addons-wow-3-3-5a/scripts/build_skill.py dist-skill/addons-wow-3-3-5a-v1.0.0.zip
          python3 .agents/skills/addons-wow-3-3-5a/scripts/build_skill.py dist-skill/addons-wow-3-3-5a-v1.0.0.skill
          cd dist-skill
          sha256sum addons-wow-3-3-5a-v1.0.0.zip addons-wow-3-3-5a-v1.0.0.skill > SHA256SUMS.txt
      - name: Publish skill release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$SKILL_TAG" \
            dist-skill/addons-wow-3-3-5a-v1.0.0.zip \
            dist-skill/addons-wow-3-3-5a-v1.0.0.skill dist-skill/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "addons wow 3.3.5a — Skill v1.0.0" \
            --notes-file .github/skill-release-notes.md --latest=false
